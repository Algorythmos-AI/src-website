name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build-time only. Payload requires a secret to construct its config; the build
# never connects to the database (admin/API routes are dynamic), so a dummy
# secret and no POSTGRES_URL are sufficient for CI.
env:
  PAYLOAD_SECRET: ci-build-only-dummy-secret-000000000000
  NEXT_PUBLIC_SITE_URL: https://src-zeta-teal.vercel.app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: i18n key parity
        run: npm run i18n:check
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: npm run e2e
