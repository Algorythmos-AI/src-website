version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Active development lives on the `next` branch (Vite → Next.js + Payload
    # migration). Dependabot reads this config from the default branch (main) but
    # opens PRs against `next` so hygiene lands where it matters.
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      payload:
        patterns:
          - payload
          - '@payloadcms/*'
          # Payload pins graphql as a peer (^16); move them together.
          - graphql
      lint-test-tooling:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - eslint-plugin-*
          - prettier
          - vitest
          - '@vitest/*'
          - '@playwright/*'
          - '@testing-library/*'
    ignore:
      # Majors are upgraded deliberately (peer ranges, e.g. Payload pins
      # graphql ^16 and jsx-a11y caps eslint at 9). Security updates are
      # unaffected — update-types only applies to version updates.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # next is pinned to Payload's supported peer range; bump deliberately.
      - dependency-name: next
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # lucide-react 1.x removed brand icons still in use; deferred to Phase 8.
      - dependency-name: lucide-react
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    ignore:
      # Action majors are upgraded deliberately.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
